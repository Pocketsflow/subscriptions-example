<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocketsflow — Inline subscription embed</title>

    <script
      src="https://app.pocketsflow.com/pocketsflow-popup.js"
      data-subdomain="YOUR_SUBDOMAIN"
    ></script>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        color: #111827;
      }
      button {
        background: #635bff;
        color: #fff;
        border: 1px solid #635bff;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #pocketsflow-checkout {
        margin-top: 20px;
        min-height: 400px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      p {
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <h1>Inline subscription checkout</h1>
    <p>
      The checkout renders inside the <code>#pocketsflow-checkout</code> div on
      the same page — no redirect, no popup.
    </p>

    <button type="button" onclick="openInline()">Load checkout</button>

    <!-- The checkout iframe is injected into this div -->
    <div id="pocketsflow-checkout"></div>

    <script>
      function openInline() {
        window.openPocketsflowCheckout({
          type: "subscription",
          subscriptionId: "YOUR_SUBSCRIPTION_ID",
          subdomain: "YOUR_SUBDOMAIN",
          embedDivId: "pocketsflow-checkout", // renders inline instead of a popup
          isDarkMode: false,
          onSuccess: (data) => {
            console.log("checkout success (UX signal only):", data);
          },
        });
      }
    </script>
  </body>
</html>
